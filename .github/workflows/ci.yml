name: Oraculo X37 BIM Audit CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oraculo-x37-bim-audit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
