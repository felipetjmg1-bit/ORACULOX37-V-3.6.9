[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oraculo-x37-bim-audit"
version = "0.2.0"
description = "Heuristic BIM object checks for Speckle Automate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Felipe Aquino / Impulso Digital" }]
keywords = ["speckle", "automate", "bim", "aec", "prototype"]
dependencies = [
    "specklepy==2026.9.2",
    "openai>=2.31.0,<4.0",
    "pydantic>=2.13.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools]
py-modules = ["main", "flatten", "audit"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
